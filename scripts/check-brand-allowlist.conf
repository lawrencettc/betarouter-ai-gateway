apps/gateway/src/chat/chat.ts:X-LLMGateway
apps/gateway/src/chat/tools/extract-custom-headers.ts:X-LLMGateway

# Enterprise admin log-filter dropdown option value referencing the legacy
# `llmgateway.io` domain as a literal filter key. Updating this is a
# same-stage rebrand-sweep task (potentially a behavior-affecting data value,
# not just cosmetic text) and ee/admin/src is outside this task's edit scope.
ee/admin/src/app/organizations/[orgId]/projects/[projectId]/project-logs.tsx:llmgateway.io
