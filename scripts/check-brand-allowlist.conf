apps/api/src/routes/chat-projects.ts:createLLMGateway
apps/api/src/routes/public-chat-support.ts:createLLMGateway
apps/api/src/routes/skills.ts:createLLMGateway
apps/playground/src/app/api/canvas/generate/route.ts:createLLMGateway
apps/playground/src/app/api/chat/route.ts:LLMGateway
apps/playground/src/app/api/image/route.ts:createLLMGateway
ee/admin/src/app/api/generate-reply/route.ts:createLLMGateway

# `X-LLMGateway-*` is the documented custom-header prefix that end users pass
# through the gateway API (see apps/docs/content/features/metadata.mdx and
