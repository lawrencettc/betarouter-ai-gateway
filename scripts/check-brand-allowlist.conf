# Allowlist for scripts/check-brand.sh.
#
# Format: one entry per line.
#   path/to/file                -> exempts every hit in the whole file
#   path/to/file:substring      -> exempts only lines in that file containing
#                                  the literal substring (plain-text match,
#                                  not a regex)
# Blank lines and lines starting with # are ignored.
#
# Keep this list minimal — every entry below is a documented, currently
# legitimate exception. Do not add new entries without a matching
# justification in the PR description.

# Internal planning doc for this rebrand-tooling stage; it quotes
# `@llmgateway/*` and old brand strings verbatim as spec text describing the
# check this script implements, not actual leaked references in shipped code.
docs/plan-upstream-integration-140.md

# Public outbound-webhook wire contract: the `X-LLMGateway-Signature`,
# `X-LLMGateway-Event`, and `X-LLMGateway-Event-Id` HTTP headers (and the doc
# comment describing them) are consumed by third-party webhook receivers.
# Renaming them is a breaking API change and out of scope for this stage-0
# tooling task.
apps/worker/src/worker.ts:LLMGateway
apps/worker/src/worker.ts:@llmgateway/server

# AI SDK code sample shown to end users: `createLLMGateway` is the real
# exported function name from the legitimate `@llmgateway/ai-sdk-provider`
# npm package, which upstream has not renamed. The import path itself is
# already covered by the ai-sdk-provider carve-out in check-brand.sh.
packages/shared/src/components/models-directory/model-code-example-dialog.tsx:createLLMGateway

