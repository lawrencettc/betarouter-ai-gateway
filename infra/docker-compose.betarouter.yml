name: betarouter-ai-gateway

services:
  betarouter:
    image: ${BETAROUTER_IMAGE:-ghcr.io/lawrencettc/betarouter-ai-gateway-unified:latest}
    build:
      context: ..
      dockerfile: infra/unified.dockerfile
      args:
        APP_VERSION: ${BETAROUTER_APP_VERSION:-self-hosted}
        TURBO_CONCURRENCY: ${BETAROUTER_BUILD_CONCURRENCY:-1}
        NODE_MAX_OLD_SPACE_SIZE: ${BETAROUTER_BUILD_NODE_HEAP_MB:-1536}
    pull_policy: ${BETAROUTER_PULL_POLICY:-always}
    restart: unless-stopped
    stop_grace_period: 2m
    expose:
      - "3002"
      - "3003"
      - "3004"
      - "3005"
      - "3006"
      - "4001"
      - "4002"
    environment:
      NODE_ENV: production
      # This is the managed BetaRouter deployment, not a self-hosted install.
      # Hosted mode keeps email ownership verification enabled and prevents the
      # self-hosted sign-in hook from auto-verifying every new account.
      HOSTED: "true"
      RUN_MIGRATIONS: "true"
      TELEMETRY_ACTIVE: ${TELEMETRY_ACTIVE:-false}

      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-betarouter}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@localhost:5432/${POSTGRES_DB:-betarouter}
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # Storage Redis: the second in-container instance (supervisord program
      # "redis-storage", AOF-persisted on the redis_storage_data volume). It
      # backs the gateway response cache and the Responses API state. Setting
      # any STORAGE_REDIS_* var opts out of the all-or-nothing fallback to
      # REDIS_*, so host AND port must both be given here.
      STORAGE_REDIS_HOST: ${STORAGE_REDIS_HOST:-localhost}
      STORAGE_REDIS_PORT: ${STORAGE_REDIS_PORT:-6380}

      # The gateway sends NO CORS headers unless this allowlist is non-empty.
      # Leave it empty for a server-to-server-only deployment; browser clients
      # (and the hosted playground, if it calls the gateway directly from the
      # browser) must be listed as full origins, optionally with a leading
      # wildcard label: https://app.example.com,https://*.example.com
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-}

      # Realtime (/v1/realtime) ships DARK. REALTIME_INLINE attaches the
      # WebSocket proxy to the gateway port and is what makes client-secret
      # minting legal; REALTIME_DISABLED is the kill switch that wins over
      # everything. See infra/DEPLOYMENT_BETAROUTER.md before flipping either.
      REALTIME_INLINE: ${REALTIME_INLINE:-false}
      REALTIME_DISABLED: ${REALTIME_DISABLED:-true}

      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      GATEWAY_API_KEY_HASH_SECRET: ${GATEWAY_API_KEY_HASH_SECRET:?GATEWAY_API_KEY_HASH_SECRET is required}
      LLM_VIDEO_CONTENT_JWT_SECRET: ${LLM_VIDEO_CONTENT_JWT_SECRET:?LLM_VIDEO_CONTENT_JWT_SECRET is required}
      PLATFORM_PROVIDER_ENCRYPTION_KEYS: ${PLATFORM_PROVIDER_ENCRYPTION_KEYS:?PLATFORM_PROVIDER_ENCRYPTION_KEYS is required}
      PLATFORM_PROVIDER_ENCRYPTION_CURRENT_VERSION: ${PLATFORM_PROVIDER_ENCRYPTION_CURRENT_VERSION:?PLATFORM_PROVIDER_ENCRYPTION_CURRENT_VERSION is required}
      PLATFORM_PROVIDER_FINGERPRINT_KEY: ${PLATFORM_PROVIDER_FINGERPRINT_KEY:?PLATFORM_PROVIDER_FINGERPRINT_KEY is required}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS is required}
      PLATFORM_ADMIN_USER_IDS: ${PLATFORM_ADMIN_USER_IDS:?PLATFORM_ADMIN_USER_IDS is required}

      # Model catalog rollout controls. Keep all enforcement off for the first
      # additive deploy, then advance them using the catalog operations runbook.
      PLATFORM_CATALOG_SHADOW_READ: ${PLATFORM_CATALOG_SHADOW_READ:-false}
      PLATFORM_CATALOG_DISCOVERY_ENABLED: ${PLATFORM_CATALOG_DISCOVERY_ENABLED:-false}
      PLATFORM_CATALOG_ROUTING_ENABLED: ${PLATFORM_CATALOG_ROUTING_ENABLED:-false}
      PLATFORM_CATALOG_BASE_READ_ENABLED: ${PLATFORM_CATALOG_BASE_READ_ENABLED:-false}
      PLATFORM_CATALOG_EMBEDDINGS_ROUTING_ENABLED: ${PLATFORM_CATALOG_EMBEDDINGS_ROUTING_ENABLED:-false}
      PLATFORM_CATALOG_VIDEOS_ROUTING_ENABLED: ${PLATFORM_CATALOG_VIDEOS_ROUTING_ENABLED:-false}
      PLATFORM_CATALOG_SPEECH_ROUTING_ENABLED: ${PLATFORM_CATALOG_SPEECH_ROUTING_ENABLED:-false}
      PLATFORM_CATALOG_TRANSCRIPTIONS_ROUTING_ENABLED: ${PLATFORM_CATALOG_TRANSCRIPTIONS_ROUTING_ENABLED:-false}
      PLATFORM_CATALOG_BREAKER_MODE: ${PLATFORM_CATALOG_BREAKER_MODE:-off}

      UI_URL: ${UI_URL:?UI_URL is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      GATEWAY_URL: ${GATEWAY_URL:?GATEWAY_URL is required}
      PLAYGROUND_URL: ${PLAYGROUND_URL:?PLAYGROUND_URL is required}
      CODE_URL: ${CODE_URL:?CODE_URL is required}
      DOCS_URL: ${DOCS_URL:?DOCS_URL is required}
      ADMIN_URL: ${ADMIN_URL:?ADMIN_URL is required}
      API_URL: ${API_URL:?API_URL is required}
      API_BACKEND_URL: ${API_BACKEND_URL:-http://localhost:4002}
      ORIGIN_URLS: ${ORIGIN_URLS:?ORIGIN_URLS is required}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?COOKIE_DOMAIN is required}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:?PASSKEY_RP_ID is required}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-BetaRouter}

      LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY:-}
      LLM_ANTHROPIC_API_KEY: ${LLM_ANTHROPIC_API_KEY:-}
      LLM_GOOGLE_AI_STUDIO_API_KEY: ${LLM_GOOGLE_AI_STUDIO_API_KEY:-}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required for hosted authentication}
      RESEND_AUDIENCE_ID: ${RESEND_AUDIENCE_ID:?RESEND_AUDIENCE_ID is required for hosted contact management}
      RESEND_NEWSLETTER_TOPIC_ID: ${RESEND_NEWSLETTER_TOPIC_ID:?RESEND_NEWSLETTER_TOPIC_ID is required for newsletter subscriptions}
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:-betarouter <hello@betarouter.com>}"
      RESEND_REPLY_TO_EMAIL: ${RESEND_REPLY_TO_EMAIL:-contact@betarouter.com}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required for hosted billing}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?STRIPE_PUBLISHABLE_KEY is required for hosted payment forms}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required for hosted billing events}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${STRIPE_PRO_MONTHLY_PRICE_ID:-}
      STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
      STRIPE_DEV_PLAN_LITE_PRICE_ID: ${STRIPE_DEV_PLAN_LITE_PRICE_ID:?STRIPE_DEV_PLAN_LITE_PRICE_ID is required for BetaPass}
      STRIPE_DEV_PLAN_PRO_PRICE_ID: ${STRIPE_DEV_PLAN_PRO_PRICE_ID:?STRIPE_DEV_PLAN_PRO_PRICE_ID is required for BetaPass}
      STRIPE_DEV_PLAN_MAX_PRICE_ID: ${STRIPE_DEV_PLAN_MAX_PRICE_ID:?STRIPE_DEV_PLAN_MAX_PRICE_ID is required for BetaPass}
      STRIPE_CHAT_PLAN_STARTER_PRICE_ID: ${STRIPE_CHAT_PLAN_STARTER_PRICE_ID:?STRIPE_CHAT_PLAN_STARTER_PRICE_ID is required for Playground plans}
      STRIPE_CHAT_PLAN_PLUS_PRICE_ID: ${STRIPE_CHAT_PLAN_PLUS_PRICE_ID:?STRIPE_CHAT_PLAN_PLUS_PRICE_ID is required for Playground plans}
      STRIPE_CHAT_PLAN_PRO_PRICE_ID: ${STRIPE_CHAT_PLAN_PRO_PRICE_ID:?STRIPE_CHAT_PLAN_PRO_PRICE_ID is required for Playground plans}
      STRIPE_PROVIDER_LISTING_PRICE_ID: ${STRIPE_PROVIDER_LISTING_PRICE_ID:?STRIPE_PROVIDER_LISTING_PRICE_ID is required for provider submissions}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - redis_data:/var/lib/redis
      - redis_storage_data:/var/lib/redis-storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          supervisorctl status | awk '$$2 != "RUNNING" { exit 1 }' &&
          for port in 3002 3003 3004 3005 3006 4001 4002; do
            curl --fail --silent --show-error "http://localhost:$$port/" >/dev/null || exit 1;
          done
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - betarouter

  betarouter-tunnel:
    image: cloudflare/cloudflared:2026.7.2
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    restart: unless-stopped
    depends_on:
      betarouter:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - betarouter

volumes:
  postgres_data:
  redis_data:
  redis_storage_data:

networks:
  betarouter:
    driver: bridge
