name: ci
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name == 'pull_request' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Ensure at most one new migration
        run: bash scripts/check-new-migrations.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Check brand references
        run: bash scripts/check-brand.sh

  lint:
    uses: ./.github/workflows/run.yml
    secrets: inherit
    with:
      cmd: pnpm build && pnpm lint && git diff --exit-code

  test:
    uses: ./.github/workflows/run.yml
    secrets: inherit
    with:
      cmd: pnpm build && pnpm run setup && pnpm test:unit && bash .github/start.sh
