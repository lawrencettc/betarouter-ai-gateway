name: deploy-production

on:
  workflow_run:
    workflows: [images]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: betarouter-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, betarouter-production]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Update production checkout
        working-directory: /opt/betarouter-ai-gateway
        env:
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          git fetch --prune origin "$DEPLOY_SHA"
          git checkout --detach "$DEPLOY_SHA"
          echo "BETAROUTER_IMAGE=ghcr.io/${GITHUB_REPOSITORY}-unified:v0.0.0-$(git rev-parse --short "$DEPLOY_SHA")" >> "$GITHUB_ENV"
          echo "BETAROUTER_PULL_POLICY=always" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Back up database and record rollback image
        working-directory: /opt/betarouter-ai-gateway
        run: |
          container_id=$(docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml ps -q betarouter)
          if [ -n "$container_id" ]; then
            previous_image=$(docker inspect --format '{{.Config.Image}}' "$container_id")
            echo "PREVIOUS_IMAGE=$previous_image" >> "$GITHUB_ENV"
            mkdir -p /opt/betarouter-backups
            backup_path="/opt/betarouter-backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
            docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml exec -T betarouter \
              sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' | gzip > "$backup_path"
          fi

      - name: Pull and deploy unified image
        working-directory: /opt/betarouter-ai-gateway
        run: |
          docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml pull
          docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml up -d --remove-orphans

      - name: Verify services
        working-directory: /opt/betarouter-ai-gateway
        run: |
          for attempt in $(seq 1 30); do
            container_id=$(docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml ps -q betarouter)
            if [ -n "$container_id" ]; then
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" || true)
            else
              status=missing
            fi
            if [ "$status" = healthy ]; then
              docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml ps
              exit 0
            fi
            sleep 10
          done
          docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml logs --tail=200
          exit 1

      - name: Verify public routes through Cloudflare
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://betarouter.com/ >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://api.betarouter.com/ >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://platform-api.betarouter.com/ >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://admin.betarouter.com/ >/dev/null

      - name: Roll back application image after a failed deploy
        if: failure() && env.PREVIOUS_IMAGE != ''
        working-directory: /opt/betarouter-ai-gateway
        env:
          BETAROUTER_IMAGE: ${{ env.PREVIOUS_IMAGE }}
          BETAROUTER_PULL_POLICY: never
        run: |
          docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml up -d --remove-orphans
          docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml ps
