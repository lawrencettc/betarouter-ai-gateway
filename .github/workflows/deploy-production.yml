name: deploy-production

on:
  workflow_run:
    workflows: [images]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: betarouter-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, betarouter-production]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Update production checkout
        working-directory: /opt/betarouter-ai-gateway
        run: |
          git fetch --prune origin main
          git checkout main
          git merge --ff-only origin/main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy unified image
        working-directory: /opt/betarouter-ai-gateway
        run: |
          docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml pull
          docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml up -d --remove-orphans

      - name: Verify services
        working-directory: /opt/betarouter-ai-gateway
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' betarouter-ai-gateway-llmgateway-1)
            if [ "$status" = healthy ]; then
              docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml ps
              exit 0
            fi
            sleep 10
          done
          docker compose --env-file .env.production -f infra/docker-compose.betarouter.yml logs --tail=200
          exit 1

